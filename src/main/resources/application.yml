spring:
  application:
    name: smarthr
  profiles:
    active: qa
  datasource:
    master:
      url: ${SPRING_DATASOURCE_MASTER_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://172.24.100.101:5432/postgres}}
      username: ${SPRING_DATASOURCE_MASTER_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
      password: ${SPRING_DATASOURCE_MASTER_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
      driver-class-name: org.postgresql.Driver
    slave:
      url: ${SPRING_DATASOURCE_SLAVE_URL:${SPRING_DATASOURCE_MASTER_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://172.24.100.101:5432/postgres}}}
      username: ${SPRING_DATASOURCE_SLAVE_USERNAME:${SPRING_DATASOURCE_MASTER_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}}
      password: ${SPRING_DATASOURCE_SLAVE_PASSWORD:${SPRING_DATASOURCE_MASTER_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}}
      driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      timeout: 6000ms
  cache:
    type: redis
    redis:
      time-to-live: 600000ms
      cache-null-values: false

server:
  port: ${PORT:8080}

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:YOUR LOCAL BOT TOKEN HERE}

management:
  endpoints:
    web:
      exposure:
        include: health

build:
  version: "3.0.0"
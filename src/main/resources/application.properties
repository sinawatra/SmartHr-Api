spring.application.name=smarthr

# Dynamic Port assigned by Render (falls back to 8080 for local dev)
server.port=${PORT:8080}

# PostgreSQL Configuration using Environment Variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://172.24.100.101:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Add this line to application.properties
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
management.endpoints.web.exposure.include=health